
name: Import public S3 files

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum files to download (0 = unlimited)"
        required: true
        default: "0"
      discover_references:
        description: "Discover files referenced by downloaded text files"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: public-s3-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Discover and download public objects
        env:
          MAX_FILES: ${{ inputs.max_files }}
          DISCOVER_REFERENCES: ${{ inputs.discover_references }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote

          BASE = "https://s3.amazonaws.com/v3lla/"
          BUCKET = "https://s3.amazonaws.com/v3lla"
          ROOT = Path(".").resolve()
          MAX_FILES = int(os.getenv("MAX_FILES", "0"))
          FOLLOW = os.getenv("DISCOVER_REFERENCES", "true").lower() == "true"
          MAX_BYTES = 99 * 1024 * 1024
          TIMEOUT = 30

          headers = {"User-Agent": "public-s3-repository-import/1.0"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                  return r.read(MAX_BYTES + 1), r.headers.get("Content-Type", "")

          def safe_key(key):
              key = unquote(key).replace("\\", "/")
              if not key or key.startswith("/") or "\x00" in key:
                  return None
              parts = key.split("/")
              if any(p in ("", ".", "..") for p in parts):
                  return None
              if parts[0] == ".git" or ".github" in parts:
                  return None
              path = (ROOT / key).resolve()
              if path != ROOT and ROOT not in path.parents:
                  return None
              return path

          def listing():
              token = None
              found = []
              while True:
                  url = BASE + "?list-type=2"
                  if token:
                      from urllib.parse import urlencode
                      url += "&" + urlencode({"continuation-token": token})
                  data, _ = get(url)
                  root = ET.fromstring(data)
                  ns = {"s": "http://s3.amazonaws.com/doc/2006-03-01/"}
                  found.extend(x.text for x in root.findall(".//s:Contents/s:Key", ns) if x.text)
                  more = root.findtext("s:IsTruncated", namespaces=ns) == "true"
                  if not more:
                      break
                  token = root.findtext("s:NextContinuationToken", namespaces=ns)
                  if not token:
                      break
              return found

          # Collect plausible same-site references from JS, HTML, CSS and JSON.
          ref_re = re.compile(
              r'''(?:"|')([^"'<>\\\s]{1,500})(?:"|')'''
          )
          text_ext = {".js", ".mjs", ".cjs", ".html", ".htm", ".css",
                      ".json", ".webmanifest", ".xml", ".svg", ".txt"}

          def references(data, key):
              try:
                  text = data.decode("utf-8", errors="ignore")
              except Exception:
                  return []
              out = set()
              for value in ref_re.findall(text):
                  value = value.replace("\\/", "/")
                  if value.startswith(("data:", "javascript:", "mailto:", "#")):
                      continue
                  if value.startswith(("http://", "https://")):
                      u = urlparse(value)
                      if u.netloc not in ("s3.amazonaws.com", "v3lla.s3.amazonaws.com"):
                          continue
                      prefix = "/v3lla/"
                      if not u.path.startswith(prefix):
                          continue
                      candidate = unquote(u.path[len(prefix):])
                  else:
                      if value.startswith("//") or "://" in value:
                          continue
                      if value.startswith("/"):
                          if not value.startswith("/v3lla/"):
                              continue
                          candidate = unquote(value[len("/v3lla/"):])
                      else:
                          candidate = unquote(urljoin("/" + key, value).lstrip("/"))
                          # urljoin above is relative to the containing file.
                  candidate = candidate.split("?", 1)[0].split("#", 1)[0]
                  if not candidate or candidate.endswith("/"):
                      continue
                  if safe_key(candidate) and Path(candidate).suffix.lower() in (
                      text_ext | {".wasm", ".png", ".jpg", ".jpeg", ".gif",
                                  ".webp", ".ico", ".woff", ".woff2", ".ttf",
                                  ".otf", ".mp3", ".mp4", ".webm", ".pdf"}
                  ):
                      out.add(candidate)
              return sorted(out)

          try:
              keys = listing()
              print(f"Public S3 listing succeeded: {len(keys)} objects")
          except Exception as e:
              print(f"Bucket listing unavailable ({e}); starting from known public entry points.")
              keys = ["sw.js", "index.html", "manifest.json",
                      "asset-manifest.json", "sitemap.xml", "robots.txt"]

          queue = deque(keys)
          seen = set()
          downloaded = 0
          skipped = 0
          errors = []

          while queue:
              key = queue.popleft()
              if key in seen:
                  continue
              seen.add(key)

              if MAX_FILES and downloaded >= MAX_FILES:
                  print(f"Reached max_files={MAX_FILES}")
                  break

              path = safe_key(key)
              if path is None:
                  continue

              url = BASE + key
              try:
                  data, content_type = get(url)
                  if len(data) > MAX_BYTES:
                      print(f"SKIP >99 MiB: {key}")
                      skipped += 1
                      continue
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      continue
                  errors.append(f"{key}: HTTP {e.code}")
                  continue
              except Exception as e:
                  errors.append(f"{key}: {e}")
                  continue

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              downloaded += 1
              print(f"Downloaded {key} ({len(data)} bytes)")

              if FOLLOW and path.suffix.lower() in text_ext:
                  for ref in references(data, key):
                      if ref not in seen:
                          queue.append(ref)

              time.sleep(0.03)

          print(f"Finished: {downloaded} downloaded, {skipped} too large, {len(errors)} errors.")
          if errors:
              print("\n".join(errors[:50]))
          if downloaded == 0:
              raise SystemExit("No files downloaded. Check public access and listing permissions.")
          PY

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Import publicly accessible v3lla S3 files"
            git push
          fi
